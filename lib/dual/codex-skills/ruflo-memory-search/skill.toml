# Codex skill: semantic search over the project's ruflo/AgentDB memory.
#
# Wraps the `memory_search` MCP tool on the `ruflo` server that `codex init` already registers.
# Arg names, required flags and defaults are taken from the server's live tools/list output,
# not assumed — `memory search "query"` positionally is the exact mistake this shape prevents.

[skill]
name = "ruflo-memory-search"
version = "0.1.0"
description = "Semantic search over the project's ruflo memory (AgentDB + HNSW). Finds prior decisions, stored patterns and past solutions by meaning rather than exact key. Search before re-deriving something the project already learned."
author = "sparkling"
homepage = "https://github.com/sparkling/ruflo-source-patch"
license = "MIT"

[dispatch]
type = "mcp_tool"
server = "ruflo"
tool = "memory_search"

[command]
name = "ruflo-memory-search"
synopsis = "Semantic search over project memory (AgentDB/HNSW)."

[[args]]
name = "query"
prompt = "Search query (semantic similarity, not a literal key)"
required = true

[[args]]
name = "namespace"
prompt = "Namespace to search (omit to search all namespaces)"
required = false

[[args]]
name = "limit"
prompt = "Maximum results"
required = false
default = "10"

[catalog]
tags = ["memory", "search", "agentdb", "hnsw", "ruflo", "semantic"]
