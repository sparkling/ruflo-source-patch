# Codex skill: initialise a ruflo swarm for multi-agent work.
#
# Wraps the `swarm_init` MCP tool on the `ruflo` server. Every arg is optional per the live
# schema, so each is offered with the server's own documented default rather than invented.

[skill]
name = "ruflo-swarm-init"
version = "0.1.0"
description = "Initialise a ruflo swarm for work that needs several coordinated agents (multi-file changes, cross-module refactors, audits). Hierarchical topology is the anti-drift default; skip this entirely for single-file edits."
author = "sparkling"
homepage = "https://github.com/sparkling/ruflo-source-patch"
license = "MIT"

[dispatch]
type = "mcp_tool"
server = "ruflo"
tool = "swarm_init"

[command]
name = "ruflo-swarm-init"
synopsis = "Initialise a coordinated multi-agent swarm."

[[args]]
name = "topology"
prompt = "Swarm topology"
required = false
default = "hierarchical"
choices = ["hierarchical", "mesh", "hierarchical-mesh"]

[[args]]
name = "maxAgents"
prompt = "Maximum number of agents (1-50)"
required = false
default = "8"

[[args]]
name = "strategy"
prompt = "Agent strategy"
required = false
default = "specialized"
choices = ["specialized", "balanced", "adaptive"]

[catalog]
tags = ["swarm", "agents", "coordination", "ruflo", "orchestration"]
