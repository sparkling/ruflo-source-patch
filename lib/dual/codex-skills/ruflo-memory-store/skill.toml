# Codex skill: persist a decision or pattern into the project's ruflo memory.
#
# Wraps the `memory_store` MCP tool on the `ruflo` server. `key` and `value` are the only
# required fields per the server's live schema; `upsert` matters because the default is to
# FAIL on an existing key rather than update it.

[skill]
name = "ruflo-memory-store"
version = "0.1.0"
description = "Persist a decision, pattern or outcome into the project's ruflo memory (AgentDB) so it survives the session and is retrievable by semantic search. Store what was decided and why, not what the code already says."
author = "sparkling"
homepage = "https://github.com/sparkling/ruflo-source-patch"
license = "MIT"

[dispatch]
type = "mcp_tool"
server = "ruflo"
tool = "memory_store"

[command]
name = "ruflo-memory-store"
synopsis = "Persist a decision or pattern into project memory."

[[args]]
name = "key"
prompt = "Memory key (unique within the namespace)"
required = true

[[args]]
name = "value"
prompt = "Value to store (string or object)"
required = true

[[args]]
name = "namespace"
prompt = "Namespace for organisation"
required = false
default = "default"

[[args]]
name = "upsert"
prompt = "Update an existing key instead of failing?"
required = false
default = "false"
choices = ["true", "false"]

[catalog]
tags = ["memory", "store", "agentdb", "ruflo", "persistence"]
